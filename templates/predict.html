<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Predict Car Price</title>

    <!-- PREDICT CSS -->

    <link rel="stylesheet"
    href="{{ url_for('static', filename='predict.css') }}">

</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav>

    <div class="logo">

        🚗 CarPrice AI

    </div>

    <ul>

        <li>

            <a href="/">Home</a>

        </li>

        <li>

            <a href="/predict">Predict</a>

        </li>

        <li>

            <a href="/analysis">Analysis</a>

        </li>

    </ul>

</nav>

<!-- ================= MAIN SECTION ================= -->

<section class="predict-container">

    <!-- LEFT SIDE -->

    <div class="predict-box">

        <h1>

            Predict Car Price

        </h1>

        <p>

            Enter vehicle details to get AI powered prediction.

        </p>

        <!-- FORM -->

        <form id="predictForm">

            <input
            type="number"
            id="vehicle_age"
            placeholder="Vehicle Age"
            required>

            <input
            type="number"
            id="km_driven"
            placeholder="KM Driven"
            required>

            <input
            type="number"
            id="mileage"
            placeholder="Mileage"
            required>

            <input
            type="number"
            id="engine"
            placeholder="Engine"
            required>

            <input
            type="number"
            id="max_power"
            placeholder="Max Power"
            required>

            <input
            type="number"
            id="seats"
            placeholder="Seats"
            required>

            <!-- SELLER -->

            <select id="seller">

                <option value="Dealer">

                    Dealer

                </option>

                <option value="Individual">

                    Individual

                </option>

                <option value="Trustmark Dealer">

                    Trustmark Dealer

                </option>

            </select>

            <!-- FUEL -->

            <select id="fuel">

                <option value="Petrol">

                    Petrol

                </option>

                <option value="Diesel">

                    Diesel

                </option>

                <option value="CNG">

                    CNG

                </option>

                <option value="Electric">

                    Electric

                </option>

                <option value="LPG">

                    LPG

                </option>

            </select>

            <!-- TRANSMISSION -->

            <select id="transmission">

                <option value="Manual">

                    Manual

                </option>

                <option value="Automatic">

                    Automatic

                </option>

            </select>

            <!-- BUTTON -->

            <button type="submit">

                Predict Price

            </button>

        </form>

        <!-- RESULT -->

        <div class="result-box">

            <h2>

                Predicted Price

            </h2>

            <h1 id="result">

                ₹ 0

            </h1>

        </div>

    </div>

    <!-- RIGHT SIDE IMAGE -->

    <div class="predict-image">

        <img
        src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?q=80&w=1400&auto=format&fit=crop"
        alt="Car Image">

    </div>

</section>

<!-- ================= JAVASCRIPT ================= -->

<script>

document.getElementById("predictForm")
.addEventListener("submit", async function(e){

    e.preventDefault();

    const data = {

        vehicle_age:
        document.getElementById("vehicle_age").value,

        km_driven:
        document.getElementById("km_driven").value,

        mileage:
        document.getElementById("mileage").value,

        engine:
        document.getElementById("engine").value,

        max_power:
        document.getElementById("max_power").value,

        seats:
        document.getElementById("seats").value,

        seller:
        document.getElementById("seller").value,

        fuel:
        document.getElementById("fuel").value,

        transmission:
        document.getElementById("transmission").value
    };

    const response = await fetch("/predict_price", {

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify(data)

    });

    const result = await response.json();

    document.getElementById("result")
    .innerHTML = "₹ " + result.price;

});

</script>

</body>

</html>
